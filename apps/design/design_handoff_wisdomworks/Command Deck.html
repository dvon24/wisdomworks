<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>WisdomWorks — Command Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@250;300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body, #root { margin: 0; padding: 0; height: 100%; }
  body { background: #0a0a14; font-family: 'Geist', system-ui, sans-serif; color: #1a1a22; -webkit-font-smoothing: antialiased; overflow-y: auto; min-height: 100vh; }

  :root {
    --accent: #7c3aed;
    --accent-soft: rgba(124,58,237,0.16);
    --accent-line: rgba(124,58,237,0.45);
    --accent-deep: #5b21b6;
    --text: #1a1a22;
    --text-dim: rgba(26,26,34,0.7);
    --text-faint: rgba(26,26,34,0.5);
    --glass-bg: rgba(255,255,255,0.55);
    --glass-bg-strong: rgba(255,255,255,0.74);
    --glass-border: rgba(20,20,30,0.08);
    --glass-border-strong: rgba(20,20,30,0.14);
  }

  /* Background photo layer (cinematic, like landing page) */
  .bg-root { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
  .bg-img { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 2.2s ease; transform: scale(1.06); animation: kenburns 24s ease-in-out infinite alternate; }
  .bg-img.active { opacity: 1; }
  @keyframes kenburns { from { transform: scale(1.04) translate(0,0); } to { transform: scale(1.12) translate(-1.5%, -1%); } }
  .bg-veil { position: absolute; inset: 0; background:
    radial-gradient(120% 80% at 30% 20%, rgba(255,255,255,0.55), rgba(255,255,255,0.32) 60%, rgba(255,255,255,0.55));
  }
  .bg-grain { position: absolute; inset: 0; pointer-events: none; opacity: 0.06; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  /* Glass surfaces */
  .glass { background: var(--glass-bg); backdrop-filter: blur(20px) saturate(140%); -webkit-backdrop-filter: blur(20px) saturate(140%); border: 1px solid var(--glass-border); border-radius: 16px; }
  .glass-strong { background: var(--glass-bg-strong); backdrop-filter: blur(28px) saturate(140%); -webkit-backdrop-filter: blur(28px) saturate(140%); border: 1px solid var(--glass-border-strong); border-radius: 18px; }

  .mono { font-family: 'Geist Mono', ui-monospace, monospace; }
  .eyebrow { font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-faint); }

  .num-xxl { font-weight: 250; font-size: 76px; letter-spacing: -0.04em; line-height: 1; }
  .num-lg  { font-weight: 300; font-size: 44px; letter-spacing: -0.03em; line-height: 1; }
  .num-md  { font-weight: 400; font-size: 22px; letter-spacing: -0.02em; line-height: 1; }

  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 11px; white-space: nowrap; flex-shrink: 0; }
  .pill.ok   { background: rgba(34,150,90,0.12); color: #1f7a48; border: 1px solid rgba(34,150,90,0.3); }
  .pill.warn { background: rgba(220,140,40,0.14); color: #8a4f10; border: 1px solid rgba(220,140,40,0.3); }
  .pill.bad  { background: rgba(200,60,60,0.12); color: #8a2a2a; border: 1px solid rgba(200,60,60,0.3); }
  .pill.info { background: var(--accent-soft); color: var(--accent-deep); border: 1px solid var(--accent-line); }
  .pill.dim  { background: rgba(20,20,30,0.04); color: var(--text-dim); border: 1px solid var(--glass-border); }

  .dot { width: 6px; height: 6px; border-radius: 999px; display: inline-block; }
  .dot.ok { background: #2cb070; box-shadow: 0 0 8px rgba(44,176,112,0.6); }
  .dot.warn { background: #d99b3b; box-shadow: 0 0 8px rgba(217,155,59,0.6); }
  .dot.bad { background: #c84545; box-shadow: 0 0 8px rgba(200,69,69,0.6); }
  .dot.acc { background: var(--accent); box-shadow: 0 0 8px var(--accent-soft); }

  .btn { background: rgba(255,255,255,0.7); border: 1px solid var(--glass-border); border-radius: 10px; padding: 8px 14px; font: inherit; font-size: 12px; color: var(--text); cursor: pointer; box-shadow: inset 0 1px 0 rgba(255,255,255,0.6); transition: all .15s; white-space: nowrap; }
  .btn:hover { background: rgba(255,255,255,0.9); }
  .btn.primary { background: var(--accent); color: white; border-color: var(--accent); box-shadow: 0 6px 20px rgba(124,58,237,0.32); }
  .btn.primary:hover { background: var(--accent-deep); }
  .btn.ghost { background: transparent; border-color: transparent; }
  .btn.ghost:hover { background: rgba(255,255,255,0.5); }
  .btn.danger { color: #8a2a2a; border-color: rgba(200,60,60,0.3); background: rgba(200,60,60,0.08); }
  .btn.danger:hover { background: rgba(200,60,60,0.14); }

  .scroll { overflow-y: auto; scrollbar-width: thin; }
  .scroll::-webkit-scrollbar { width: 6px; }
  .scroll::-webkit-scrollbar-thumb { background: rgba(20,20,30,0.15); border-radius: 999px; }

  /* Hierarchy node animations */
  @keyframes breath { 0%,100% { opacity: 0.45; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
  .breathe { animation: breath 3s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
  @keyframes pop-in { from { opacity: 0; transform: scale(0.6); } to { opacity: 1; transform: scale(1); } }
  .pop-in { animation: pop-in 0.5s cubic-bezier(0.2,0.8,0.3,1.4) both; transform-origin: center; transform-box: fill-box; }
  @keyframes fade-out { to { opacity: 0; transform: scale(0.7); } }
  .fade-out { animation: fade-out 0.4s ease both; transform-origin: center; transform-box: fill-box; }

  /* Chat */
  .chat-root { position: fixed; right: 20px; bottom: 20px; z-index: 30; transition: width .35s cubic-bezier(0.2,0.8,0.3,1), height .35s cubic-bezier(0.2,0.8,0.3,1); }
  .chat-collapsed { width: 380px; height: 56px; }
  .chat-expanded  { width: 460px; height: 540px; }

  /* Sidebar slide-in (agent panel) */
  .panel-slide { position: fixed; right: 16px; top: 16px; bottom: 16px; width: 420px; z-index: 40; transform: translateX(440px); transition: transform .38s cubic-bezier(0.2,0.8,0.3,1); }
  .panel-slide.open { transform: translateX(0); }

  /* Floating price diff */
  .price-card { position: fixed; left: 24px; bottom: 96px; z-index: 25; }

  /* Hide native focus rings on inputs we style ourselves */
  input, textarea { color: var(--text); }
  input::placeholder { color: rgba(26,26,34,0.4); }

  /* tag for agent picker */
  .agent-row { display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 12px; transition: background .12s; }
  .agent-row:hover { background: rgba(255,255,255,0.5); }
</style>
</head>
<body>
  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
      <defs>
        <radialGradient id="bg" cx="50%" cy="50%" r="70%">
          <stop offset="0%" stop-color="#1a1530"/>
          <stop offset="100%" stop-color="#0a0a14"/>
        </radialGradient>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.6"/>
          <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <rect width="400" height="400" fill="url(#bg)"/>
      <circle cx="200" cy="200" r="140" fill="url(#glow)"/>
      <g fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.9">
        <ellipse cx="200" cy="200" rx="90" ry="32"/>
        <ellipse cx="200" cy="200" rx="90" ry="32" transform="rotate(60 200 200)"/>
        <ellipse cx="200" cy="200" rx="90" ry="32" transform="rotate(-60 200 200)"/>
      </g>
      <circle cx="200" cy="200" r="14" fill="#a78bfa"/>
      <circle cx="200" cy="200" r="22" fill="none" stroke="#a78bfa" stroke-opacity="0.4" stroke-width="1"/>
    </svg>
  </template>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="logo.jsx"></script>
  <script type="text/babel" src="hierarchy.jsx"></script>
  <script type="text/babel" src="chat.jsx"></script>
  <script type="text/babel" src="agent-panel.jsx"></script>
  <script type="text/babel" src="agent-detail.jsx"></script>
  <script type="text/babel" src="price-diff.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
